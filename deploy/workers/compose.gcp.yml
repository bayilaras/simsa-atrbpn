services:
  cloud-sql-proxy:
    profiles: ["gcp"]
    image: ${CLOUD_SQL_PROXY_IMAGE:?CLOUD_SQL_PROXY_IMAGE digest is required}
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command:
      - --structured-logs
      - --private-ip
      - --auto-iam-authn
      - --unix-socket=/cloudsql
      - --health-check
      - --http-address=127.0.0.1
      - --http-port=9090
      - --max-connections=${CLOUD_SQL_PROXY_MAX_CONNECTIONS:-10}
      - ${CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Cloud SQL connection name is required}
    volumes:
      - cloud-sql-sockets:/cloudsql
    healthcheck:
      test:
        - CMD
        - /cloud-sql-proxy
        - wait
        - --http-address=127.0.0.1
        - --http-port=9090
        - --max=5s
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CLOUD_SQL_PROXY_MEMORY_LIMIT:-256m}
    cpus: ${CLOUD_SQL_PROXY_CPU_LIMIT:-0.5}
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-5}
    networks:
      outbound:
        gw_priority: 1

  malware-worker:
    environment:
      DATABASE_URL: ""
      CLOUD_SQL_UNIX_SOCKET: /cloudsql/${CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Cloud SQL connection name is required}
      DB_HOST: ""
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ""
      DB_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-3}
      DB_APPLICATION_NAME: simsa-malware-worker
      SIMSA_CLOUD_PLATFORM: gcp
      AUTH_PROVIDER: firebase
      OBJECT_STORAGE_PROVIDER: gcs
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT is required}
      FIREBASE_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT is required}
      GCS_UPLOAD_BUCKET: ${GCS_UPLOAD_BUCKET:?GCS_UPLOAD_BUCKET is required}
      GCS_BUCKET: ${GCS_BUCKET:?GCS_BUCKET is required}
      FINAL_RETENTION_SECONDS: ${FINAL_RETENTION_SECONDS:?FINAL_RETENTION_SECONDS is required}
      FINAL_ORPHAN_RETENTION_MARGIN_SECONDS: ${FINAL_ORPHAN_RETENTION_MARGIN_SECONDS:?FINAL_ORPHAN_RETENTION_MARGIN_SECONDS is required}
      BLOB_READ_WRITE_TOKEN: ""
    volumes:
      - cloud-sql-sockets:/cloudsql:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
        restart: true

  blob-reconciler:
    environment:
      DATABASE_URL: ""
      CLOUD_SQL_UNIX_SOCKET: /cloudsql/${CLOUD_SQL_INSTANCE_CONNECTION_NAME:?Cloud SQL connection name is required}
      DB_HOST: ""
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ""
      DB_SSL: "false"
      DB_POOL_MAX: ${DB_POOL_MAX:-3}
      DB_APPLICATION_NAME: simsa-blob-reconciler
      SIMSA_CLOUD_PLATFORM: gcp
      OBJECT_STORAGE_PROVIDER: gcs
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT is required}
      GCS_UPLOAD_BUCKET: ${GCS_UPLOAD_BUCKET:?GCS_UPLOAD_BUCKET is required}
      GCS_BUCKET: ${GCS_BUCKET:?GCS_BUCKET is required}
      BLOB_READ_WRITE_TOKEN: ""
    volumes:
      - cloud-sql-sockets:/cloudsql:ro
    depends_on:
      cloud-sql-proxy:
        condition: service_healthy
        restart: true

volumes:
  clamav-signatures:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAMAV_SIGNATURES_PATH:?Persistent ClamAV signature mount is required}
  cloud-sql-sockets:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLOUD_SQL_SOCKET_PATH:?Cloud SQL socket mount is required}

networks:
  clamav-updates:
    ipam:
      config:
        - subnet: ${CLAMAV_UPDATE_SUBNET:-172.31.250.0/28}
