<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-simsa.png" />
  <!-- Keep pinch-to-zoom available for low-vision and older users. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMSA Internal Ditjen PTPP</title>
  <meta name="description" content="Sistem Informasi Manajemen Surat dan Arsip untuk penggunaan internal Ditjen PTPP" />

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#17666b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SIMSA Internal" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="SIMSA Internal Ditjen PTPP" />
  <meta name="msapplication-TileColor" content="#17666b" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Inter is bundled via @fontsource-variable/inter so the app renders
       without a font CDN and keeps its typography offline. -->

  <!-- Notice for browsers below the build target (vite.config.js
       BROWSER_TARGETS: Chrome/Edge 111, Firefox 128, Safari 16.4). Plain CSS,
       no JavaScript: shown by default and hidden only where the browser
       passes the checks below, so it also appears when the app cannot start. -->
  <style>
    .peramban-tidak-didukung {
      display: block;
      margin: 0;
      padding: 12px 16px;
      border-bottom: 1px solid #b45309;
      background: #fffbeb;
      color: #78350f;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    /* Chrome/Edge 111+, Firefox 113+, Safari 16.2+ */
    @supports (color: color-mix(in srgb, red, red)) {
      .peramban-tidak-didukung { display: none; }
    }
    /* Firefox before 128 (no relative color syntax yet) */
    @supports (-moz-orient: inline) and (not (color: rgb(from red r g b))) {
      .peramban-tidak-didukung { display: block; }
    }
    /* Safari before 16.4 (no margin-trim yet) */
    @supports (-webkit-appearance: -apple-pay-button) and (not (margin-trim: block)) {
      .peramban-tidak-didukung { display: block; }
    }
  </style>
</head>

<body>
  <p class="peramban-tidak-didukung" lang="id">Peramban ini tidak didukung SIMSA. Gunakan Chrome, Edge, Firefox, atau Safari versi terbaru.</p>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
