<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066b3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004a80;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Letter S for SIMSA -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="300" font-weight="bold" fill="white">S</text>
  <!-- Document icon hint -->
  <rect x="340" y="60" width="100" height="130" rx="10" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="4"/>
  <line x1="360" y1="100" x2="420" y2="100" stroke="white" stroke-width="4"/>
  <line x1="360" y1="130" x2="420" y2="130" stroke="white" stroke-width="4"/>
  <line x1="360" y1="160" x2="400" y2="160" stroke="white" stroke-width="4"/>
