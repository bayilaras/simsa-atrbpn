version: "2"
type: frontend
tech_stack:
  - JavaScript (JSX)
  - React 19
  - Vite 7
  - TailwindCSS 4
  - React Router DOM 7
  - Radix UI
  - shadcn/ui
  - Recharts
  - Axios
  - Better Auth Client
routes:
  - path: /login
    file: src/pages/Login.jsx
    auth_required: false
    description: User login page with email/password and Google OAuth
  - path: /
    file: src/pages/Dashboard.jsx
    auth_required: true
    description: Main dashboard with statistics and charts
  - path: /surat/masuk
    file: src/pages/SuratMasuk.jsx
    auth_required: true
    description: Incoming mail list with search and filters
  - path: /surat/masuk/tambah
    file: src/pages/TambahSuratMasuk.jsx
    auth_required: true
    description: Create new incoming mail form
  - path: /surat/masuk/:id
    file: src/pages/SuratMasukDetail.jsx
    auth_required: true
    description: Incoming mail detail view
  - path: /surat/masuk/edit/:id
    file: src/pages/TambahSuratMasuk.jsx
    auth_required: true
    description: Edit incoming mail form
  - path: /surat/keluar
    file: src/pages/SuratKeluar.jsx
    auth_required: true
    description: Outgoing mail list
  - path: /surat/keluar/tambah
    file: src/pages/TambahSuratKeluar.jsx
    auth_required: true
    description: Create new outgoing mail form
  - path: /surat/keluar/:id
    file: src/pages/SuratKeluarDetail.jsx
    auth_required: true
    description: Outgoing mail detail view
  - path: /surat/keluar/edit/:id
    file: src/pages/TambahSuratKeluar.jsx
    auth_required: true
    description: Edit outgoing mail form
  - path: /distribusi
    file: src/pages/DistributionInbox.jsx
    auth_required: true
    description: Distribution inbox for mails
  - path: /arsip/:tab
    file: src/pages/Arsip.jsx
    auth_required: true
    description: Archive listing with tabs (masuk/keluar)
  - path: /arsip/detail/:id
    file: src/pages/ArsipDetail.jsx
    auth_required: true
    description: Archive detail view
  - path: /bulk-upload
    file: src/pages/BulkUpload.jsx
    auth_required: true
    description: Bulk data upload via CSV/Excel
  - path: /laporan
    file: src/pages/Laporan.jsx
    auth_required: true
    description: Reports and analytics
  - path: /audit-log
    file: src/pages/AuditLog.jsx
    auth_required: true
    description: Audit log viewer (admin/auditor only)
  - path: /settings
    file: src/pages/Settings.jsx
    auth_required: true
    description: Application settings (super admin only)
  - path: /users
    file: src/pages/UserManagement.jsx
    auth_required: true
    description: User management (super admin only)
  - path: /master/klasifikasi
    file: src/pages/KlasifikasiArsip.jsx
    auth_required: true
    description: Archive classification management (admin only)
  - path: /master/jra
    file: src/pages/JadwalRetensi.jsx
    auth_required: true
    description: Retention schedule management (admin only)
  - path: /storage-locations
    file: src/pages/StorageLocations.jsx
    auth_required: true
    description: Physical storage location management (admin only)
  - path: /archive-lending
    file: src/pages/ArchiveLending.jsx
    auth_required: true
    description: Archive lending/borrowing
  - path: /dosir
    file: src/pages/Dosir.jsx
    auth_required: true
    description: Dossier list
  - path: /dosir/:id
    file: src/pages/DosirDetail.jsx
    auth_required: true
    description: Dossier detail view
  - path: /retention
    file: src/pages/RetentionManagement.jsx
    auth_required: true
    description: Retention management
  - path: /penyusutan
    file: src/pages/PenyusutanArsip.jsx
    auth_required: true
    description: Archive disposal management
  - path: /arsip-vital
    file: src/pages/ArsipVital/index.jsx
    auth_required: true
    description: Vital archives management
  - path: /arsip-terjaga
    file: src/pages/ArsipTerjaga/index.jsx
    auth_required: true
    description: Protected archives management
  - path: /arsip-elektronik
    file: src/pages/ArsipElektronik/index.jsx
    auth_required: true
    description: Electronic archives management
  - path: /tunjuk-silang
    file: src/pages/TunjukSilang.jsx
    auth_required: true
    description: Cross-reference management
  - path: /autentikasi
    file: src/pages/Autentikasi/Index.jsx
    auth_required: true
    description: Media authentication list
  - path: /autentikasi/create
    file: src/pages/Autentikasi/Create.jsx
    auth_required: true
    description: Create media authentication
  - path: /formulir
    file: src/pages/Formulir/Index.jsx
    auth_required: true
    description: Forms index
  - path: /formulir/cetak/:id
    file: src/pages/Formulir/FormulirViewer.jsx
    auth_required: true
    description: Formulir print view
  - path: /layanan-arsip
    file: src/pages/LayananArsip/Index.jsx
    auth_required: true
    description: Archive service list
  - path: /layanan-arsip/create
    file: src/pages/LayananArsip/Create.jsx
    auth_required: true
    description: Create new archive service request
  - path: /layanan-arsip/:id
    file: src/pages/LayananArsip/Detail.jsx
    auth_required: true
    description: Archive service detail view
features:
  - name: User Login
    description: Login with email/password or Google OAuth
    files:
      - src/pages/Login.jsx
      - src/context/AuthContext.jsx
      - src/services/auth.service.js
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Login button to submit
      - Click Google Sign-In button
      - See error message on invalid credentials
      - Toggle password visibility
    api_calls:
      - method: POST
        endpoint: /api/auth/sign-in/email
      - method: POST
        endpoint: /api/auth/sign-in/social
    auth_required: false
  - name: Dashboard
    description: View statistics, charts, and summary of mail and archives
    files:
      - src/pages/Dashboard.jsx
      - src/services/dashboard.service.js
    entry_route: /
    user_interactions:
      - View mail and archive statistics cards
      - View charts for mail trends
      - See recent activities
    api_calls:
      - method: GET
        endpoint: /api/dashboard
    auth_required: true
  - name: Incoming Mail Management
    description: Create, view, edit, and delete incoming mails
    files:
      - src/pages/SuratMasuk.jsx
      - src/pages/TambahSuratMasuk.jsx
      - src/pages/SuratMasukDetail.jsx
      - src/services/surat-masuk.service.js
    entry_route: /surat/masuk
    user_interactions:
      - View list of incoming mails
      - Search by keyword
      - Filter by date, status
      - Click to view mail details
      - Click add button to create new mail
      - Fill in mail form fields
      - Upload attachment files
      - Submit the form
      - Edit existing mail
      - Delete a mail
    api_calls:
      - method: GET
        endpoint: /api/surat-masuk
      - method: POST
        endpoint: /api/surat-masuk
      - method: GET
        endpoint: /api/surat-masuk/:id
      - method: PUT
        endpoint: /api/surat-masuk/:id
      - method: DELETE
        endpoint: /api/surat-masuk/:id
    auth_required: true
  - name: Outgoing Mail Management
    description: Create, view, edit, and delete outgoing mails
    files:
      - src/pages/SuratKeluar.jsx
      - src/pages/TambahSuratKeluar.jsx
      - src/pages/SuratKeluarDetail.jsx
      - src/services/surat-keluar.service.js
    entry_route: /surat/keluar
    user_interactions:
      - View list of outgoing mails
      - Search and filter mails
      - Create new outgoing mail
      - View mail details
      - Edit existing mail
      - Delete a mail
    api_calls:
      - method: GET
        endpoint: /api/surat-keluar
      - method: POST
        endpoint: /api/surat-keluar
      - method: GET
        endpoint: /api/surat-keluar/:id
      - method: PUT
        endpoint: /api/surat-keluar/:id
      - method: DELETE
        endpoint: /api/surat-keluar/:id
    auth_required: true
  - name: Archive Management
    description: View and manage archives with tabs
    files:
      - src/pages/Arsip.jsx
      - src/pages/ArsipDetail.jsx
      - src/services/arsip.service.js
    entry_route: /arsip/keluar
    user_interactions:
      - Switch between archive tabs
      - View archive list
      - Search archives
      - View archive details
    api_calls:
      - method: GET
        endpoint: /api/arsip
      - method: GET
        endpoint: /api/arsip/:id
    auth_required: true
  - name: User Management
    description: Admin manages users, roles, and access
    files:
      - src/pages/UserManagement.jsx
      - src/services/user-management.service.js
    entry_route: /users
    user_interactions:
      - View user list
      - Create new user
      - Edit user role
      - Deactivate user
    api_calls:
      - method: GET
        endpoint: /api/users
      - method: POST
        endpoint: /api/users
      - method: PUT
        endpoint: /api/users/:id
    auth_required: true
  - name: Reports
    description: Generate and view reports with export options
    files:
      - src/pages/Laporan.jsx
      - src/services/report.service.js
    entry_route: /laporan
    user_interactions:
      - Select report type
      - Set date range filters
      - Generate report
      - Export to Excel/PDF
    api_calls:
      - method: GET
        endpoint: /api/reports
      - method: GET
        endpoint: /api/export
    auth_required: true
known_limitations: []
