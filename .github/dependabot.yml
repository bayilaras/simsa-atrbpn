# Pembaruan dependensi otomatis. Kontrak diuji oleh
# .github/scripts/dependabot-config.test.mjs (job Security Audit): setiap
# proyek yang diaudit gerbang npm audit di ci.yml wajib tercantum di sini.
#
# - Versi minor/patch digabung menjadi satu PR per proyek; versi major tetap
#   PR tersendiri karena perlu ditinjau perubahan perilakunya.
# - Pembaruan keamanan (Dependabot security updates) tidak masuk grup mana pun,
#   sehingga tiba sebagai PR tersendiri secepatnya, di luar jadwal dan cooldown.
#   `ignore` sengaja tidak dipakai: aturan itu juga menahan PR keamanan.
#   Satu pengecualian sempit: kenaikan mayor @types/node di /backend dan
#   /frontend (alasannya di blok masing-masing).
# - Cooldown 5 hari hanya berlaku untuk pembaruan versi (bukan keamanan),
#   memberi waktu rilis npm yang bermasalah ditarik sebelum diusulkan.
# - Lockfile npm (lockfileVersion 3) diperbarui oleh Dependabot sendiri; CI
#   menjalankan `npm ci` dan gerbang audit yang sama seperti PR lain.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Mayor @types/node mengikuti runtime (engines "24.x", Node 24 di Vercel dan
    # CI): tipe yang lebih baru meloloskan API yang belum ada di produksi. Paket
    # ini hanya deklarasi tipe tanpa advisori keamanan; minor/patch 24.x tetap
    # datang lewat grup. Hapus aturan ini saat engines naik mayor.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
        # Better Auth memeriksa skema akun saat start; kenaikan 1.7.3 butuh
        # migrasi 0052 (identitas akun kembali ke (providerId, accountId)).
        # Kenaikan berikutnya bisa membawa perubahan skema serupa, jadi datang
        # sebagai PR tersendiri dan tidak menahan grup ini. Bukan `ignore`: PR
        # keamanan tetap tiba.
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Sama seperti /backend: mayor @types/node mengikuti engines "24.x".
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
        # eslint-plugin-react-hooks mempertajam validasi React Compiler di rilis
        # minor. 7.1 menemukan 63 pelanggaran lama (set-state-in-effect,
        # static-components, refs, ...) yang dibekukan di
        # frontend/eslint-suppressions.json; temuan baru rilis berikutnya
        # membuat `npm run lint` merah. Karena itu paket ini datang sebagai PR
        # tersendiri dan tidak menahan grup ini. Bukan `ignore`: PR keamanan
        # tetap tiba.
        exclude-patterns:
          - "eslint-plugin-react-hooks"

  # Situs dokumentasi juga diaudit gerbang CI, tetapi jarang berubah: pembaruan
  # versi bulanan; pembaruan keamanan tetap segera.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "monthly"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docs-site-minor-patch:
        update-types: ["minor", "patch"]

  # Action dipin ke SHA dengan komentar versi (`# v4`); Dependabot memperbarui
  # SHA dan komentarnya bersama-sama.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
