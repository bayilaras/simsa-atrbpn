name: SIMSA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript check (backend)
        run: npx tsc --noEmit
        working-directory: backend

      # Non-blocking until the pre-existing eslint errors in frontend/src are cleared.
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
        continue-on-error: true

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npx vitest run --reporter=verbose
        working-directory: backend

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npx vitest run --reporter=verbose
        working-directory: frontend

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Non-blocking, but a failing step is surfaced in the run summary instead of
      # being swallowed by `|| true`.
      - name: Audit backend
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true

      - name: Audit frontend
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
