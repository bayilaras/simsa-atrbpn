name: SIMSA CI

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simsa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            docs-site/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs-site

      - name: TypeScript check (backend)
        run: npx tsc --noEmit
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

      - name: Validate worker Compose definitions
        run: |
          docker compose --env-file .env.example -f compose.yml --profile '*' config --quiet
          docker compose --env-file .env.example -f compose.yml -f compose.local.yml --profile '*' config --quiet
        working-directory: deploy/workers

      - name: Validate production worker image preflight
        run: |
          digest=$(printf 'a%.0s' {1..64})
          SIMSA_WORKER_IMAGE="ghcr.io/example/simsa-worker@sha256:${digest}" \
            sh ./preflight-worker-image.sh --format-only
          if SIMSA_WORKER_IMAGE="ghcr.io/example/simsa-worker:latest" \
            sh ./preflight-worker-image.sh --format-only; then
            echo "::error::Worker preflight unexpectedly accepted a mutable tag."
            exit 1
          fi
        working-directory: deploy/workers

      - name: Build and inspect worker image
        run: |
          docker build --check --file backend/Dockerfile.worker backend
          docker build --file backend/Dockerfile.worker --tag simsa-worker:${{ github.sha }} backend
          docker run --rm --entrypoint node simsa-worker:${{ github.sha }} --check dist/workers/malware-scan.js

      - name: Verify production uses the same-origin API proxy
        run: |
          if VITE_API_URL=https://simsa-backend.vercel.app npm run build > api-proxy-guard.log 2>&1; then
            echo "::error::Production build unexpectedly accepted a cross-origin client API."
            exit 1
          fi
          grep -q "must leave VITE_API_URL unset" api-proxy-guard.log
          if VITE_API_URL=https://simsa-backend.vercel.app npm run build -- --mode staging > api-proxy-guard-staging.log 2>&1; then
            echo "::error::Staging-mode deployment build unexpectedly accepted a cross-origin client API."
            exit 1
          fi
          grep -q "must leave VITE_API_URL unset" api-proxy-guard-staging.log
          rm -f api-proxy-guard.log
          rm -f api-proxy-guard-staging.log
        working-directory: frontend

      - name: Build documentation
        run: npm run build
        working-directory: docs-site

  clamav-smoke:
    name: ClamAV Clean, EICAR & Restart Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Scan clean and EICAR samples before and after restart
        shell: bash
        env:
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: '3310'
          CLAMAV_SMOKE_WAIT_MS: '360000'
          CLAMAV_SMOKE_POLL_MS: '2000'
        run: |
          set -Eeuo pipefail
          container="simsa-clamav-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker logs --tail 200 "$container" || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          clamav_image=$(docker compose \
            --env-file deploy/workers/.env.example \
            -f deploy/workers/compose.yml \
            config --images | awk '/^clamav\/clamav:/{ print; exit }')
          if [ -z "$clamav_image" ]; then
            echo "::error::Could not resolve the pinned ClamAV image from Compose."
            exit 1
          fi

          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:3310:3310 \
            --env CLAMD_CONF_StreamMaxLength=52428800 \
            "$clamav_image"

          npm --prefix backend run smoke:clamav
          docker restart --time 30 "$container"
          npm --prefix backend run smoke:clamav

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: simsa_test
          POSTGRES_PASSWORD: simsa_test_password
          POSTGRES_DB: simsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simsa_test -d simsa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npx vitest run --reporter=verbose
        working-directory: backend

      - name: Apply migrations and prove concurrent seed idempotency
        run: |
          npm run db:migrate
          npm run seed:all &
          first_seed=$!
          npm run seed:all &
          second_seed=$!
          wait "$first_seed"
          wait "$second_seed"
          npm run seed:all
        working-directory: backend
        env:
          DATABASE_URL: postgresql://simsa_test:simsa_test_password@127.0.0.1:5432/simsa_test

      - name: Validate exact backup schema profiles
        env:
          PGPASSWORD: simsa_test_password
        run: |
          set -euo pipefail
          POSTGRES_IMAGE='postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2'
          EXPECTED_MIGRATIONS_JSON=$(python3 \
            "$GITHUB_WORKSPACE/.github/scripts/build-migration-manifest.py")
          PROFILE_ERROR_LOG="$RUNNER_TEMP/simsa-backup-pre-profile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          POST_AUTO_EVIDENCE="$RUNNER_TEMP/simsa-backup-post-auto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.evidence"
          PRE_AUTO_EVIDENCE="$RUNNER_TEMP/simsa-backup-pre-auto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.evidence"
          PRE_PROFILE_DATABASE='simsa_backup_pre_profile'
          cleanup_backup_profile_tests() {
            status=$?
            trap - EXIT
            docker run --rm --network host \
              --env PGPASSWORD \
              "$POSTGRES_IMAGE" \
              dropdb \
                --host 127.0.0.1 \
                --username simsa_test \
                --if-exists \
                --force \
                "$PRE_PROFILE_DATABASE" >/dev/null 2>&1 || true
            rm -f -- "$PROFILE_ERROR_LOG" "$POST_AUTO_EVIDENCE" "$PRE_AUTO_EVIDENCE"
            exit "$status"
          }
          trap cleanup_backup_profile_tests EXIT

          # The fully migrated CI database must compile and pass the exact
          # 0000-0029 post-migration profile. Verifier output contains only
          # counts/digests and is discarded here; no application rows are logged.
          docker run --rm --interactive --network host \
            --env PGPASSWORD \
            --volume "$GITHUB_WORKSPACE/.github/scripts:/verifier:ro" \
            "$POSTGRES_IMAGE" \
            psql \
              --host 127.0.0.1 \
              --username simsa_test \
              --dbname simsa_test \
              --no-psqlrc \
              --set ON_ERROR_STOP=on \
              --set backup_profile=post_migration \
              --set expected_migrations_json="$EXPECTED_MIGRATIONS_JSON" \
              --quiet \
              --tuples-only \
              --no-align \
              > /dev/null <<'SQL'
          INSERT INTO public.users (email)
          VALUES ('backup-verifier@ci.invalid')
          ON CONFLICT (email) DO NOTHING;
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          \i /verifier/collect-backup-evidence.sql
          ROLLBACK;
          SQL

          # Scheduled mode may resolve only one of the exact histories. On the
          # current 30-migration DB it must resolve to post_migration.
          docker run --rm --interactive --network host \
            --env PGPASSWORD \
            --volume "$GITHUB_WORKSPACE/.github/scripts:/verifier:ro" \
            "$POSTGRES_IMAGE" \
            psql \
              --host 127.0.0.1 \
              --username simsa_test \
              --dbname simsa_test \
              --no-psqlrc \
              --set ON_ERROR_STOP=on \
              --set backup_profile=auto \
              --set expected_migrations_json="$EXPECTED_MIGRATIONS_JSON" \
              --quiet \
              --tuples-only \
              --no-align \
              > "$POST_AUTO_EVIDENCE" <<'SQL'
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          \i /verifier/collect-backup-evidence.sql
          ROLLBACK;
          SQL
          grep -Fq $'schema_profile\tpost_migration\t1\t' "$POST_AUTO_EVIDENCE"

          # A 30-migration database must fail closed when the operator chooses
          # the pre-migration (0000-0020) profile.
          if docker run --rm --interactive --network host \
            --env PGPASSWORD \
            --volume "$GITHUB_WORKSPACE/.github/scripts:/verifier:ro" \
            "$POSTGRES_IMAGE" \
            psql \
              --host 127.0.0.1 \
              --username simsa_test \
              --dbname simsa_test \
              --no-psqlrc \
              --set ON_ERROR_STOP=on \
              --set backup_profile=pre_migration \
              --set expected_migrations_json="$EXPECTED_MIGRATIONS_JSON" \
              --quiet \
              --tuples-only \
              --no-align \
              > "$PROFILE_ERROR_LOG" 2>&1 <<'SQL'
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          \i /verifier/collect-backup-evidence.sql
          ROLLBACK;
          SQL
          then
            echo "::error::pre_migration profile unexpectedly accepted migration 0021-0029."
            exit 1
          fi
          grep -Fq 'migration history does not exactly match the pre_migration profile' \
            "$PROFILE_ERROR_LOG"

          # Build an independent database from the real 0000-0020 migration SQL
          # and hashes. Deleting later history rows from the 0029 schema would
          # not exercise the schema that the first Production backup will use.
          docker run --rm --network host \
            --env PGPASSWORD \
            "$POSTGRES_IMAGE" \
            dropdb \
              --host 127.0.0.1 \
              --username simsa_test \
              --if-exists \
              --force \
              "$PRE_PROFILE_DATABASE"
          docker run --rm --network host \
            --env PGPASSWORD \
            "$POSTGRES_IMAGE" \
            createdb \
              --host 127.0.0.1 \
              --username simsa_test \
              --template template0 \
              "$PRE_PROFILE_DATABASE"
          python3 "$GITHUB_WORKSPACE/.github/scripts/build-migration-manifest.py" \
              --emit-profile-sql pre_migration | \
            docker run --rm --interactive --network host \
              --env PGPASSWORD \
              "$POSTGRES_IMAGE" \
              psql \
                --host 127.0.0.1 \
                --username simsa_test \
                --dbname "$PRE_PROFILE_DATABASE" \
                --no-psqlrc \
                --set ON_ERROR_STOP=on \
                --quiet

          # Explicit pre_migration must pass on the actual 0020 schema.
          docker run --rm --interactive --network host \
            --env PGPASSWORD \
            --volume "$GITHUB_WORKSPACE/.github/scripts:/verifier:ro" \
            "$POSTGRES_IMAGE" \
            psql \
              --host 127.0.0.1 \
              --username simsa_test \
              --dbname "$PRE_PROFILE_DATABASE" \
              --no-psqlrc \
              --set ON_ERROR_STOP=on \
              --set backup_profile=pre_migration \
              --set expected_migrations_json="$EXPECTED_MIGRATIONS_JSON" \
              --quiet \
              --tuples-only \
              --no-align \
              > /dev/null <<'SQL'
          INSERT INTO public.users (email)
          VALUES ('backup-verifier-pre@ci.invalid')
          ON CONFLICT (email) DO NOTHING;
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          \i /verifier/collect-backup-evidence.sql
          ROLLBACK;
          SQL

          # Scheduled auto mode must resolve the exact same 0020 fixture to the
          # pre_migration profile, never merely accept a numeric threshold.
          docker run --rm --interactive --network host \
            --env PGPASSWORD \
            --volume "$GITHUB_WORKSPACE/.github/scripts:/verifier:ro" \
            "$POSTGRES_IMAGE" \
            psql \
              --host 127.0.0.1 \
              --username simsa_test \
              --dbname "$PRE_PROFILE_DATABASE" \
              --no-psqlrc \
              --set ON_ERROR_STOP=on \
              --set backup_profile=auto \
              --set expected_migrations_json="$EXPECTED_MIGRATIONS_JSON" \
              --quiet \
              --tuples-only \
              --no-align \
              > "$PRE_AUTO_EVIDENCE" <<'SQL'
          BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY;
          \i /verifier/collect-backup-evidence.sql
          ROLLBACK;
          SQL
          grep -Fq $'schema_profile\tpre_migration\t1\t' "$PRE_AUTO_EVIDENCE"

      - name: Run PostgreSQL concurrency tests
        run: npm run test:postgres-locks
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql://simsa_test:simsa_test_password@127.0.0.1:5432/simsa_test

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npx vitest run --reporter=verbose
        working-directory: frontend

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Audit backend
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Audit frontend
        run: npm audit --audit-level=high
        working-directory: frontend

      # Docusaurus currently has a no-fix high advisory in its trusted local-image
      # build pipeline. Block critical regressions until upstream ships a patch.
      - name: Audit documentation
        run: npm audit --audit-level=critical
        working-directory: docs-site
