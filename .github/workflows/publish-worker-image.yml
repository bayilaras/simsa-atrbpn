name: Publish Immutable Worker Image (No Deployment)

on:
  push:
    tags:
      - "worker-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: simsa-worker-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require source from the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          default_head=$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$default_head"; then
            echo "::error::Worker images may only be published from commits already on ${DEFAULT_BRANCH}."
            exit 1
          fi
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$GITHUB_SHA" != "$default_head" ]; then
            echo "::error::Manual publication must run from the current ${DEFAULT_BRANCH} head."
            exit 1
          fi

      - name: Define immutable image coordinates
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-worker"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${image}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build candidate locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          platforms: linux/amd64
          load: true
          push: false
          tags: simsa-worker-candidate:${{ github.sha }}
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,mode=max,scope=worker-image

      - name: Inspect candidate worker entrypoints
        shell: bash
        run: |
          set -Eeuo pipefail
          for entrypoint in \
            dist/workers/malware-scan.js \
            dist/workers/srikandi.js \
            dist/workers/blob-reconciliation.js; do
            docker run --rm --entrypoint node \
              "simsa-worker-candidate:${GITHUB_SHA}" --check "$entrypoint"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish with provenance and SBOM attestations
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker-image
          provenance: mode=max
          sbom: true

      - name: Publish GitHub build provenance attestation
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify and record immutable release reference
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -Eeuo pipefail
          immutable_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$immutable_ref" >/dev/null
          {
            echo '### SIMSA worker image published'
            echo
            echo "Immutable deployment reference: \`${immutable_ref}\`"
            echo
            echo 'BuildKit provenance and SPDX SBOM attestations are attached to this digest.'
            echo 'This workflow does not modify any deployment or production environment.'
          } >> "$GITHUB_STEP_SUMMARY"
