    name: Restore API and event receiver after an incomplete release
    if: >-
      ${{ always() && inputs.deploy_event_receiver &&
          needs.event_candidate.result == 'success' &&
          (needs.event_promote.result != 'success' ||
           needs.canary_5.result != 'success' ||
           needs.canary_25.result != 'success' ||
           needs.promote_100.result != 'success') }}
    needs:
      - validate
      - candidate
      - event_candidate
      - event_promote
      - canary_5
      - canary_25
      - promote_100
    runs-on:
      - self-hosted
      - linux
      - x64
      - simsa-gcp-private
    timeout-minutes: 20
    environment:
      name: gcp-${{ inputs.environment }}-backend-coordinated-rollback
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tooling by immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize coordinated rollback evidence
        shell: bash
        run: mkdir -p release-evidence

      - name: Authenticate to Google Cloud through keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ needs.candidate.outputs.project_id }}
          workload_identity_provider: ${{ needs.candidate.outputs.wif_provider }}
          service_account: ${{ needs.candidate.outputs.deploy_service_account }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ needs.candidate.outputs.project_id }}
          version: ">= 500.0.0"

      - name: Restore and verify both exact previous revisions
        shell: bash
        env:
          PROJECT_ID: ${{ needs.candidate.outputs.project_id }}
          REGION: ${{ needs.candidate.outputs.region }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          API_SERVICE: ${{ needs.candidate.outputs.api_service }}
          API_CONTAINER: api
          API_PREVIOUS_REVISION: ${{ needs.candidate.outputs.previous_revision }}
          API_PREVIOUS_DIGEST: ${{ needs.candidate.outputs.previous_digest }}
          EVENT_SERVICE: ${{ needs.candidate.outputs.event_service }}
          EVENT_CONTAINER: events
          EVENT_PREVIOUS_REVISION: ${{ needs.event_candidate.outputs.previous_revision }}
          EVENT_PREVIOUS_DIGEST: ${{ needs.event_candidate.outputs.previous_digest }}
          EXPECTED_EVENTARC_INVOKER_SERVICE_ACCOUNT: ${{ needs.validate.outputs.eventarc_invoker_service_account }}
          ROLLBACK_EVENT: "true"
          EVENT_PROMOTE_RESULT: ${{ needs.event_promote.result }}
          CANARY_5_RESULT: ${{ needs.canary_5.result }}
          CANARY_25_RESULT: ${{ needs.canary_25.result }}
          PROMOTE_100_RESULT: ${{ needs.promote_100.result }}
          EVIDENCE_DIR: release-evidence
        run: bash .github/scripts/release-gcp-backend.sh coordinated-rollback

      - name: Upload coordinated rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gcp-backend-${{ inputs.environment }}-${{ needs.validate.outputs.commit_sha }}-${{ github.run_id }}-coordinated-rollback
          path: release-evidence
          if-no-files-found: error
          retention-days: 30

  api_only_rollback:
    name: Restore API after an incomplete API-only release
    if: >-
      ${{ always() && !inputs.deploy_event_receiver &&
          needs.candidate.result == 'success' &&
          (needs.canary_5.result != 'success' ||
           needs.canary_25.result != 'success' ||
           needs.promote_100.result != 'success') }}
    needs:
      - validate
      - candidate
      - event_promote
      - canary_5
      - canary_25
      - promote_100
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: gcp-${{ inputs.environment }}-backend-coordinated-rollback
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tooling by immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize API rollback evidence
        shell: bash
        run: mkdir -p release-evidence

      - name: Authenticate to Google Cloud through keyless WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ needs.candidate.outputs.project_id }}
          workload_identity_provider: ${{ needs.candidate.outputs.wif_provider }}
          service_account: ${{ needs.candidate.outputs.deploy_service_account }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ needs.candidate.outputs.project_id }}
          version: ">= 500.0.0"

      - name: Restore and verify the exact previous API revision
        shell: bash
        env:
          PROJECT_ID: ${{ needs.candidate.outputs.project_id }}
          REGION: ${{ needs.candidate.outputs.region }}
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          API_SERVICE: ${{ needs.candidate.outputs.api_service }}
          API_CONTAINER: api
          API_PREVIOUS_REVISION: ${{ needs.candidate.outputs.previous_revision }}
          API_PREVIOUS_DIGEST: ${{ needs.candidate.outputs.previous_digest }}
          ROLLBACK_EVENT: "false"
          EVENT_PROMOTE_RESULT: ${{ needs.event_promote.result }}
          CANARY_5_RESULT: ${{ needs.canary_5.result }}
          CANARY_25_RESULT: ${{ needs.canary_25.result }}
          PROMOTE_100_RESULT: ${{ needs.promote_100.result }}
          EVIDENCE_DIR: release-evidence
        run: bash .github/scripts/release-gcp-backend.sh coordinated-rollback

      - name: Upload API-only rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gcp-backend-${{ inputs.environment }}-${{ needs.validate.outputs.commit_sha }}-${{ github.run_id }}-api-only-rollback
          path: release-evidence
          if-no-files-found: error
          retention-days: 30
