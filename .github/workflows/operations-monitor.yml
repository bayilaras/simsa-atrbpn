name: SIMSA Operations Monitor

# Pemicu wake pemindai yang utama adalah Vercel Cron (backend/vercel.json,
# enam kali sehari); jadwal GitHub di bawah bersifat best-effort dan hanya
# mendeteksi gangguan. Repositori publik: menit Actions tidak dibatasi.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      storage_latency:
        description: 'Ukur latensi Blob privat dari fungsi produksi (unggah/unduh/hapus 6 objek uji)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: simsa-operations-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Operational Health
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production-monitor
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify monitor contract
        run: node --test scripts/check-operations.test.mjs
      - name: Check deployed operational state
        env:
          OPERATIONS_MONITOR_TOKEN: ${{ secrets.OPERATIONS_MONITOR_TOKEN }}
        run: node scripts/check-operations.mjs
      - name: Measure private storage latency
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.storage_latency }}
        env:
          OPERATIONS_MONITOR_TOKEN: ${{ secrets.OPERATIONS_MONITOR_TOKEN }}
        run: node scripts/check-operations.mjs --storage-latency

  # Repository watchers get an email from the issue. The repository is public:
  # the issue holds a fixed sentence and the run link only. A timed-out job
  # ends as "cancelled", so that result is reported as well.
  notify-failure:
    name: Report failure
    needs: monitor
    if: ${{ always() && (needs.monitor.result == 'failure' || needs.monitor.result == 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_ISSUE_MIN_HOURS: '6'
        run: node scripts/ops/report-workflow-failure.mjs
